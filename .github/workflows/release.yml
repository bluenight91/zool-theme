name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          [[ "$tag" == "v$version" ]] || { echo "Tag $tag must match package.json version v$version"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:size
      - run: pnpm package

      - name: Publish dist.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Nezha shows the release title as the theme name and the tag as the version.
          # A title of "v1.1.3" was listed as "v1.1.3 · v1.1.3".
          title="ZOOL"
          notes="ZOOL ${tag} for Nezha. In 设置 → 前端管理 → 用户前端, install this repository. The asset Nezha reads is dist.zip."
          # Drafts are dropped by Nezha's frontend installer, so a stable tag is published immediately.
          # `--prerelease` is a switch: passing `=false` would still mark the release as a prerelease.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/dist.zip --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --target "$(git rev-parse HEAD)"
          else
            args=(release create "$tag" release/dist.zip --verify-tag --title "$title" --notes "$notes")
            [[ "$tag" != *-* ]] || args+=(--prerelease)
            gh "${args[@]}"
          fi
